general:
  stop_time: 7200s
  seed: 12345
  parallelism: 0
  model_unblocked_syscall_latency: true
  log_level: warning
  progress: true
experimental:
  use_dynamic_runahead: true
  native_preemption_enabled: true
network:
  graph:
    type: 1_gbit_switch
hosts:
  zano1:
    network_node_id: 0
    ip_addr: 11.0.0.1
    processes:
      - path: /home/user/zano/build-sim/src/zanod
        args: [--data-dir=/tmp/zpow3/n1, --no-predownload, --disable-upnp, --no-console,
               --db-engine=lmdb, --allow-local-ip, --p2p-bind-ip=11.0.0.1,
               --p2p-bind-port=11121, --rpc-bind-ip=11.0.0.1, --rpc-bind-port=11211,
               --rpc-ignore-offline, --log-level=1, --add-priority-node=11.0.0.2:11121, --add-priority-node=11.0.0.3:11121]
        environment: {HOME: /home/user, MALLOC_ARENA_MAX: '1'}
        start_time: 1s
        expected_final_state: running
      - path: /usr/bin/python3.12
        args: [/home/user/zanogen/agents/pow_driver.py]
        environment:
          HOME: /home/user
          ZANO_RPC: 11.0.0.1:11211
          ZANO_MINER_ADDRESS: "ZxCDCPzB9Y1jFVJq6f5qah34jMU2aKjnbKZMdhdijreiPRRv97cnD3Jd64YZFPXjxdgx8aQy7FNkE4x2kCB1SrGV1hGy46ejB"
          POW_TARGET_SEC: '120'
          MINER_WEIGHT: '50'
          TOTAL_WEIGHT: '100'
          SIMULATION_SEED: '12345'
          AGENT_ID: pow-001
        start_time: 30s
        expected_final_state: running
  zano2:
    network_node_id: 0
    ip_addr: 11.0.0.2
    processes:
      - path: /home/user/zano/build-sim/src/zanod
        args: [--data-dir=/tmp/zpow3/n2, --no-predownload, --disable-upnp, --no-console,
               --db-engine=lmdb, --allow-local-ip, --p2p-bind-ip=11.0.0.2,
               --p2p-bind-port=11121, --rpc-bind-ip=11.0.0.2, --rpc-bind-port=11211,
               --rpc-ignore-offline, --log-level=1, --add-priority-node=11.0.0.1:11121, --add-priority-node=11.0.0.3:11121]
        environment: {HOME: /home/user, MALLOC_ARENA_MAX: '1'}
        start_time: 2s
        expected_final_state: running
      - path: /usr/bin/python3.12
        args: [/home/user/zanogen/agents/pow_driver.py]
        environment:
          HOME: /home/user
          ZANO_RPC: 11.0.0.2:11211
          ZANO_MINER_ADDRESS: "ZxCDCPzB9Y1jFVJq6f5qah34jMU2aKjnbKZMdhdijreiPRRv97cnD3Jd64YZFPXjxdgx8aQy7FNkE4x2kCB1SrGV1hGy46ejB"
          POW_TARGET_SEC: '120'
          MINER_WEIGHT: '30'
          TOTAL_WEIGHT: '100'
          SIMULATION_SEED: '12345'
          AGENT_ID: pow-002
        start_time: 30s
        expected_final_state: running
  zano3:
    network_node_id: 0
    ip_addr: 11.0.0.3
    processes:
      - path: /home/user/zano/build-sim/src/zanod
        args: [--data-dir=/tmp/zpow3/n3, --no-predownload, --disable-upnp, --no-console,
               --db-engine=lmdb, --allow-local-ip, --p2p-bind-ip=11.0.0.3,
               --p2p-bind-port=11121, --rpc-bind-ip=11.0.0.3, --rpc-bind-port=11211,
               --rpc-ignore-offline, --log-level=1, --add-priority-node=11.0.0.1:11121, --add-priority-node=11.0.0.2:11121]
        environment: {HOME: /home/user, MALLOC_ARENA_MAX: '1'}
        start_time: 3s
        expected_final_state: running
      - path: /usr/bin/python3.12
        args: [/home/user/zanogen/agents/pow_driver.py]
        environment:
          HOME: /home/user
          ZANO_RPC: 11.0.0.3:11211
          ZANO_MINER_ADDRESS: "ZxCDCPzB9Y1jFVJq6f5qah34jMU2aKjnbKZMdhdijreiPRRv97cnD3Jd64YZFPXjxdgx8aQy7FNkE4x2kCB1SrGV1hGy46ejB"
          POW_TARGET_SEC: '120'
          MINER_WEIGHT: '20'
          TOTAL_WEIGHT: '100'
          SIMULATION_SEED: '12345'
          AGENT_ID: pow-003
        start_time: 30s
        expected_final_state: running
