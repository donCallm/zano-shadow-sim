# Late-joining hashrate test — measures chain cadence when total hashrate
# jumps from 100 to 300 mid-run (GitHub issue #8 follow-up).
#
# History: with NO difficulty response (ec973683 era, DAA_WINDOW=0) this
# measured the raw distortion — 36 s/block permanently after the join
# (3.5x, archive 20260821_111847). With the synthetic DAA (default since
# 9394b098) the chain bursts and then retargets back toward 2 min; use
# hashrate_join_300_6h.yaml for validation, which has enough post-join
# runway (~2 windows) to observe full recovery (final-2h 133s measured).
general:
  stop_time: 4h
  simulation_seed: 12345
  bootstrap_end_time: 30m
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  process_threads: 2
  native_preemption: true
  daemon_defaults:
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 1
network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  miner-001:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 0s
    hashrate: 20
  miner-002:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 1s
    hashrate: 20
  miner-003:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 2s
    hashrate: 20
  miner-004:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 3s
    hashrate: 20
  miner-005:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 4s
    hashrate: 20
  # --- Late cohort: joins at 2h, adds 200 (total 300) ---
  miner-006:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 7200s
    hashrate: 40
  miner-007:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 7205s
    hashrate: 40
  miner-008:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 7210s
    hashrate: 40
  miner-009:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 7215s
    hashrate: 40
  miner-010:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 7220s
