# DAA battery: chain split 60/40 with per-chain retargeting — 8h.
# Fork v14->v15 at height 130 (~4.3h). Majority = miners 001-003 (60),
# minority = 004-005 (40, short schedule). With the synthetic DAA each
# partition should retarget toward 120s on its OWN chain:
#   majority: S jumps to 200s at fork, window flush ~100min, settled by ~6h
#   minority: S jumps to 300s, flush ~2.5h, approaching 120s by run end
# No users/distributor — pure cadence measurement.
general:
  stop_time: 8h
  simulation_seed: 12345
  bootstrap_end_time: 30m
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  process_threads: 2
  native_preemption: true
  daemon_defaults:
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
    fakechain-hard-forks: "1:0,14:1,15:130"
  wallet_defaults:
    log-level: 1
network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  monero-seed-001:
    daemon: monerod-hf
    start_time: 0s
  monero-seed-002:
    daemon: monerod-hf
    start_time: 1s
  monero-seed-003:
    daemon: monerod-hf
    start_time: 2s
  monero-seed-004:
    daemon: monerod-hf
    start_time: 3s
  monero-seed-005:
    daemon: monerod-hf
    start_time: 4s
  monero-seed-006:
    daemon: monerod-hf
    start_time: 5s
  miner-001:
    daemon: monerod-hf
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 0s
    hashrate: 20
  miner-002:
    daemon: monerod-hf
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 1s
    hashrate: 20
  miner-003:
    daemon: monerod-hf
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 2s
    hashrate: 20
  miner-004:
    daemon: monerod-hf
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 3s
    hashrate: 20
    daemon_options:
      fakechain-hard-forks: "1:0,14:1"
  miner-005:
    daemon: monerod-hf
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 4s
    hashrate: 20
    daemon_options:
      fakechain-hard-forks: "1:0,14:1"
  simulation-monitor:
    script: agents.simulation_monitor
    poll_interval: 300
